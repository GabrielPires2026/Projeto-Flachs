<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--TAG QUE DEVERÁ SER ALTERADA CONFORME MODIFICAÇÕES NO CÓDIGO-->
    <meta name="author" content="Gabriel Pires">
    <meta name="description" content="Pagina inicial - Projeto Flach's">
    <link rel="stylesheet" href="Teste.css">
    <title>Pagina principal - Projeto Flach's</title>
</head>

<body>
    <header class="cabecalho-pagina">
        <button class="btn-navegacao">
            <img class="icone-voltar"> Voltar à página inicial.
        </button>
    </header>
    <main class="container-pagina">
        <div class="pagina-cadastro">
            <section class="section-form-cadastro">
                <form action="#" method="post" class="form-cadastro">
                     <h1>Cadastre-se aqui:  </h1>
                <form action="#" method="post">
                    <fieldset class="informacoes-pessoais"> <legend>Informações pessoais</legend>
                        <label for="inNome"> Digite seu nome:
                        <input type="text" id="inNome" name="nome" required>
                        </label>
                    <label for="inEmail"> Digite um email válido:
                        <input type="email" id="inEmail" name="e-mail" placeholder="Ex: nomeDoEmail@gmail.com" required>
                    </label>
                    <label for="inCpf"> Digite seu CPF:
                        <input type="text" id="inCpf" name="cpf" minlength="14" maxlength="14"  required>
                    </label>
                    <label for="inSenha"> Digite uma senha forte: 
                        <input type="password" id="inSenha" name="senha" required>
                    </label>
                    <label for="inConfirmaSenha"> Confirme sua senha:
                        <input type="password" id="inConfirmarSenha" name="confirmarSenha" required>
                    </label>
                    </fieldset>
                    <fieldset class="informacoes-local"> <legend>Localização: </legend>
                        <h2>Região:</h2>
                        <label for="inEstado"> Digite o estado 
                            <input type="text" id="inEstado" name="estado" required>
                        </label>
                        <label for="inCidade">Digite a cidade onde você mora
                            <input type="text" id="inCidade" name="cidade" required>
                        </label>
                        <h2>Endereço: </h2>
                        <label for="inBairro">Digite o bairro onde você mora 
                            <input type="text" id="inBairro" name="bairro" required>
                        </label>
                        <label for="inRua"> Digite o nome da rua onde você mora 
                            <input type="text" id="inRua" name="rua" required>
                        </label>
                        <label for="inSN"> S/N <input type="radio" id="inSN" name="semNumero"></label>
                        <label for="inNumero">Digite o número da sua residência
                            <input type="number" id="inNumero">
                        </label>
                        <label for="inComplemento">Complemento (opcional)
                            <textarea id="inComplemento"></textarea>
                        </label>
                    </fieldset>
                    <fieldset class="forma-cadastro"><legend>Forma de cadástro</legend>
                    <h2>Como você deseja se cadastrar?</h2>
                    <label for="inCliente">
                        <input type="radio" id="inCliente" name="clientes"> sou cliente 
                    </label>
                    <label for="inEntregador">
                        <input type="radio" id="inEntregador" name="entregadores"> Sou entregador 
                    </label>
                    <label for="inVendedor">
                        <input type="radio" id="inVendedor" name="vendedores">Sou vendedor
                    </label>
                    <label for="inEmpresario">
                        <input type="radio" id="inEmpresario" name="empresarios">Sou empresário
                    </label>
                    </fieldset>
                    <input type="submit" id="btnEnviar" value="Cadastrar-se">
                    <input type="reset" id="btnResetar" value="Recarregar página">
                </form>
                </form>
            </section> 
        </div>

        <div class="pagina-cliente" style="display:none;">
            <header class="cabecalho-">

            </header>
            <section class="section-principal">

            </section>
            <section class="section-perfil">

            </section>
            <section class="section-configs">
                
            </section>
        </div>
        <div class="pagina-empresario" style="display:none;">
            <header class="cabecalho-">

            </header>
            <section class="section-principal">

            </section>
            <section class="section-perfil">

            </section>
            <section class="section-configs">

            </section>
        </div>
        <div class="pagina-entregador" style="display:none;">
            <header class="cabecalho-">

            </header>
            <section class="section-principal">

            </section>
            <section class="section-perfil">

            </section>
            <section class="section-configs">

            </section>
        </div>
        <div class="pagina-vendedor" style="display:none;">
            <header class="cabecalho-">

            </header>
            <section class="section-principal">

            </section>
            <section class="section-perfil">

            </section>
            <section class="section-configs">

            </section>
        </div>
    </main>
    </div>
</body>

</html>
