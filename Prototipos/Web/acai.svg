<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradAcai" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#141416"/>
    </radialGradient>
    <radialGradient id="acaiCream" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="60%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#20033a"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="glowAcai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Moldura Arredondada Dark -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bgGradAcai)" stroke="#3f3f46" stroke-width="3"/>
  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#glowAcai)"/>

  <!-- Sombra da Tigela -->
  <ellipse cx="50" cy="77" rx="30" ry="6" fill="#000000" opacity="0.5"/>

  <!-- Base da Tigela de Cerâmica Branca -->
  <path d="M20 46 C20 68 33 76 50 76 C67 76 80 68 80 46 Z" fill="url(#bowl)"/>

  <!-- Superfície Cremosa do Açaí -->
  <ellipse cx="50" cy="46" rx="30" ry="12" fill="url(#acaiCream)"/>

  <!-- Borda Superior da Tigela -->
  <ellipse cx="50" cy="46" rx="30" ry="12" fill="none" stroke="#f8fafc" stroke-width="2"/>

  <!-- Fatias de Morango (Lado Esquerdo) -->
  <g transform="translate(26, 40) rotate(-15)">
    <path d="M0 6 C-4 0 0 -6 6 0 C10 4 4 10 0 6 Z" fill="#ef4444"/>
    <circle cx="2" cy="1" r="0.5" fill="#fef08a"/>
    <circle cx="4" cy="4" r="0.5" fill="#fef08a"/>
  </g>
  <g transform="translate(32, 36) rotate(10)">
    <path d="M0 7 C-5 0 0 -7 7 0 C11 5 5 11 0 7 Z" fill="#dc2626"/>
    <circle cx="2" cy="1" r="0.6" fill="#fef08a"/>
    <circle cx="4" cy="5" r="0.6" fill="#fef08a"/>
  </g>

  <!-- Granola / Castanhas Crocantes no Centro -->
  <circle cx="48" cy="45" r="1.6" fill="#d97706"/>
  <circle cx="51" cy="43" r="1.3" fill="#b45309"/>
  <circle cx="47" cy="48" r="1.8" fill="#f59e0b"/>
  <circle cx="52" cy="47" r="1.4" fill="#d97706"/>
  <circle cx="55" cy="44" r="1.2" fill="#78350f"/>
  <circle cx="45" cy="43" r="1.1" fill="#fde68a"/>

  <!-- Fatias de Banana Alinhadas (Lado Direito) -->
  <g>
    <!-- Rodela 1 -->
    <ellipse cx="61" cy="40" rx="5.5" ry="4" fill="#fef08a" stroke="#facc15" stroke-width="0.8"/>
    <circle cx="61" cy="40" r="0.8" fill="#a16207"/>
    <!-- Rodela 2 -->
    <ellipse cx="67" cy="44" rx="5.5" ry="4" fill="#fef9c3" stroke="#facc15" stroke-width="0.8"/>
    <circle cx="67" cy="44" r="0.8" fill="#a16207"/>
    <!-- Rodela 3 -->
    <ellipse cx="71" cy="50" rx="5.5" ry="4" fill="#fef08a" stroke="#facc15" stroke-width="0.8"/>
    <circle cx="71" cy="50" r="0.8" fill="#a16207"/>
    <!-- Rodela 4 -->
    <ellipse cx="68" cy="56" rx="5.2" ry="3.8" fill="#fef9c3" stroke="#facc15" stroke-width="0.8"/>
    <circle cx="68" cy="56" r="0.7" fill="#a16207"/>
  </g>

  <!-- Folha de Hortelã decorativa -->
  <path d="M40 37 C40 31 46 31 47 37 C44 38 41 39 40 37 Z" fill="#22c55e"/>
</svg>