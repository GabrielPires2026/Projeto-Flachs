<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradBurger" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#141416"/>
    </radialGradient>
    <linearGradient id="bunTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="patty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#592b15"/>
      <stop offset="100%" stop-color="#321406"/>
    </linearGradient>
    <linearGradient id="glowBurger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Moldura Arredondada Dark -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bgGradBurger)" stroke="#3f3f46" stroke-width="3"/>
  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#glowBurger)"/>

  <!-- Sombra no fundo do burger -->
  <ellipse cx="50" cy="74" rx="28" ry="6" fill="#000000" opacity="0.6"/>

  <!-- Pão Superior -->
  <path d="M25 43 C25 24 75 24 75 43 Z" fill="url(#bunTop)"/>
  
  <!-- Sementes de Gergelim -->
  <ellipse cx="38" cy="31" rx="1.5" ry="0.9" fill="#fef08a" transform="rotate(-15 38 31)"/>
  <ellipse cx="50" cy="28" rx="1.5" ry="0.9" fill="#fef08a"/>
  <ellipse cx="62" cy="32" rx="1.5" ry="0.9" fill="#fef08a" transform="rotate(20 62 32)"/>
  <ellipse cx="44" cy="37" rx="1.4" ry="0.8" fill="#fef08a" transform="rotate(-5 44 37)"/>
  <ellipse cx="56" cy="37" rx="1.4" ry="0.8" fill="#fef08a" transform="rotate(15 56 37)"/>

  <!-- Alface Ondulada -->
  <path d="M22 43 C24 47 28 47 30 43 C33 48 38 48 41 43 C44 48 49 48 52 43 C55 48 60 48 63 43 C66 48 70 47 73 43 C76 43 78 46 75 48 C71 50 67 47 64 48 C60 50 55 47 51 48 C47 50 42 47 38 48 C34 50 29 47 26 48 C23 48 20 46 22 43 Z" fill="#22c55e"/>

  <!-- Rodela de Tomate -->
  <rect x="24" y="47" width="52" height="5" rx="2.5" fill="#ef4444"/>
  <circle cx="36" cy="49.5" r="1.2" fill="#b91c1c"/>
  <circle cx="50" cy="49.5" r="1.2" fill="#b91c1c"/>
  <circle cx="64" cy="49.5" r="1.2" fill="#b91c1c"/>

  <!-- Queijo Cheddar Derretido -->
  <path d="M23 52 L77 52 L72 60 L62 53 L52 62 L43 53 L32 60 L27 52 Z" fill="#f59e0b"/>

  <!-- Hambúrguer de Carne Suculenta -->
  <rect x="23" y="55" width="54" height="11" rx="5.5" fill="url(#patty)"/>
  <!-- Marcas da grelha na carne -->
  <line x1="33" y1="58" x2="39" y2="63" stroke="#220b02" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="47" y1="58" x2="53" y2="63" stroke="#220b02" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="61" y1="58" x2="67" y2="63" stroke="#220b02" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Pão Inferior -->
  <path d="M26 66 L74 66 C74 72 69 76 60 76 L40 76 C31 76 26 72 26 66 Z" fill="#d97706"/>
</svg>