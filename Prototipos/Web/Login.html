<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Página de login do projeto FLACHS">
        <!--TAG QUE SERÁ MUDADA CONFORME MODIFICAÇÕES POSTERIORES-->
        <meta name="author" content="Gabriel Pires">
        <title>Página de login - PROJETO FLACHS </title>
    </head>
    <body>
        <h1>Seja bem vindo ao projeto FLACHS</h1>
        <form action="#" method="post">
            <label for="inNome"> Digite se nome completo:
                <input type="text" id="inNome" placeholder="Ex: Davi Ferreira">
            </label>
            <label for="inEmail"> Digite um email válido:
                <input type="email" id="inEmail">
            </label>
            <label for="inSenha">
                <input type="password" id="inSenha">
            </label>
            <label for="inConfirmarSenha">
                <input type="password" id="inConfirmarSenha">
            </label>
            <h2>Escolha algum cargo:  </h2>
            <label for="inCliente">Clientes/Usuários <input type="radio" id="inCliente"></label>
            <label for="inEntregador">Entregadores: <input type="radio" id="inEntregador"> </label>
            <label for="inVendedor">Vendedor: <input type="radio" id="inVendedor"> </label>
            <label for="inEmpresario">Empresário: <input type="radio" id="inEmpresario"> </label>
            <input type="submit" class="btn1" value="Enviar">
            <input type="reset" class="btn2" value="Recarregar página">
        </form>
    </body>
</html>
