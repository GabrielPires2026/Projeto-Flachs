<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradPizza" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#141416"/>
    </radialGradient>
    <linearGradient id="crust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="glowPizza" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Moldura Arredondada Dark -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bgGradPizza)" stroke="#3f3f46" stroke-width="3"/>
  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#glowPizza)"/>

  <!-- Sombra da fatia -->
  <path d="M50 78 L21 34 Q50 20 79 34 Z" fill="#000000" opacity="0.45" transform="translate(0, 3)"/>

  <!-- Fatia de Pizza: Corpo de Queijo Derretido -->
  <path d="M50 76 L23 30 Q50 18 77 30 Z" fill="url(#cheese)"/>

  <!-- Borda Crocante da Pizza (Crust) -->
  <path d="M22 30 Q50 17 78 30 C80 25 74 21 50 21 C26 21 20 25 22 30 Z" fill="url(#crust)"/>

  <!-- Queijo Derretido Escorrendo na ponta -->
  <path d="M47 73 Q50 81 52 73 Z" fill="#fbbf24"/>
  <path d="M42 66 Q44 72 46 66 Z" fill="#f59e0b"/>

  <!-- Fatias de Pepperoni / Calabresa -->
