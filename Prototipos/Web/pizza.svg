  <circle cx="43" cy="38" r="5" fill="#991b1b"/>
  <circle cx="41.5" cy="36.5" r="1.2" fill="#fca5a5" opacity="0.6"/>

  <circle cx="61" cy="42" r="7" fill="#b91c1c"/>
  <circle cx="61" cy="42" r="5.5" fill="#991b1b"/>
  <circle cx="59.5" cy="40.5" r="1.2" fill="#fca5a5" opacity="0.6"/>

  <circle cx="49" cy="55" r="6" fill="#b91c1c"/>
  <circle cx="49" cy="55" r="4.5" fill="#991b1b"/>
  <circle cx="47.5" cy="53.5" r="1.2" fill="#fca5a5" opacity="0.6"/>

  <circle cx="34" cy="48" r="5" fill="#b91c1c"/>
  <circle cx="34" cy="48" r="3.8" fill="#991b1b"/>

  <!-- Folhas de Manjericão Fresco -->
  <path d="M54 33 C58 33 60 37 54 39 C50 38 51 34 54 33 Z" fill="#16a34a"/>
  <path d="M37 57 C39 55 43 57 41 61 C37 60 36 58 37 57 Z" fill="#22c55e"/>

  <!-- Orégano / Tempero salpicado -->
  <circle cx="48" cy="46" r="0.8" fill="#3f6212"/>
