<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--TAGS QUE DEVERÃO SER ALTERADAS MEDIANTE MODIFICASÇÕES NO CÓDIGO-->
    <meta name="author" content="Gabriel Pires">
    <meta name="description" content="Pagina dos empresarios">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-nav-content">
        <nav class="nav-sair">
            <a href="Pagina-principal.html" class="icone-seta-content">
            <img class="icone-seta-retorno" src="icone-seta-retorno.svg">
        </a>
        </nav>
    </header>
    <main class="main-container">
        <h1 class="tittle-pagina-empresario">Página do empresário</h1>
        <aside class="aside-perfil-empresario">
            <h2 class="tittle-perfil-empresario">Perfil do empresario</h2>
            <p class="nome-empresario"></p>
            <img src="#">
            <h2 class="tittle-cnpj">CNPJ</h2>
            <span class="text-cnpj"></span>
             <h2 class="tittle-bio">Biografia</h2>
            <span class="texto-biografia"></span>
            
            <nav class="nav-perfil-principal">
               <button class="btn-saldo">Acessar meu saldo</button>
               <span class="info-saldo" style="display: none;"></span>
                <button class="btn-saldo-empresa">Acessar saldo da empresa</button>
                <span class="innfo-saldo-empresa" style="display:none;"></span>
                <button class="btn-config-perfil">Alterar perfil</button>
                <dialog class="modal-config-perfil">
                    <h2 class="tittle-config-perfil">Configurações do perfil</h2>
                    <input type="file" id="inFoto-perfil"> Escolha uma nova foto de perfil!
                    <input type="text" id="inNome-usuario" placeholder="escreva um nome de usuario"> 
                    <input type="text" id="inBiografia" placeholder="escreva uma Biografia">
                    <input type="submit" id="btnEnviar-informacoes-perfil" value="Enviar informações">
                </dialog>
            </nav>
        </aside>
        <section class="sectiom-post-produtos">
            <article class="post-pedidos">
                <h2>pedido atual</h2>
            </article>
        </section>
    </main>






    <script src="index.js"></script>
</body>
</html>
